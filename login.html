<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>로그인 · 요고비</title>
  <link rel="stylesheet" href="./assets/fonts.css">
  <link rel="stylesheet" href="./src/redesign.css">
  <script type="module" src="./src/login.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./"><span class="brand-mark">B</span>YogoB</a>
  <nav class="header-nav"><a class="btn btn-ghost" href="./account.html">회원가입</a></nav>
</header>

<main class="auth" role="main">
  <div class="auth-logo" aria-hidden="true">요</div>
  <h1>요고비 로그인</h1>
  <p class="auth-sub" id="auth-sub">이메일 또는 Google 계정으로 계속하세요.</p>

  <!-- 1. 이메일 입력 -->
  <section data-step="email">
    <form id="email-form" novalidate>
      <label class="sr-only" for="email">이메일</label>
      <input class="auth-input" id="email" name="email" type="email" inputmode="email"
             autocomplete="email" placeholder="name@work-email.com" required>
      <button class="btn btn-brand btn-block" type="submit">이메일로 계속하기</button>
    </form>
    <div class="auth-divider"></div>
    <button type="button" class="btn btn-social btn-block" id="google">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-3.9 6.9-9.7 6.9-17.4z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.2 0 11.5-2 15.3-5.5l-7.3-5.7c-2 1.4-4.7 2.3-8 2.3-6.3 0-11.6-3.8-13.5-9.4l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
      Google로 계속하기
    </button>
    <p class="auth-alt">계정이 없으신가요? <a href="./account.html">회원가입</a></p>
  </section>

  <!-- 2. 코드 입력 -->
  <section data-step="code" hidden>
    <p class="auth-sub">가입된 계정이면 <strong id="code-email"></strong>로 인증 코드를 보냈어요.</p>
    <div class="code-inputs" id="code-inputs" role="group" aria-label="6자리 인증 코드">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="1번째 자리">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="2번째 자리">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="3번째 자리">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="4번째 자리">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="5번째 자리">
      <input class="code-box" inputmode="numeric" maxlength="1" aria-label="6번째 자리">
    </div>
    <p class="auth-status" id="verify-status" role="status" hidden>확인 중… <span class="spin-sm" aria-hidden="true"></span></p>
    <p class="auth-warn" id="code-warn" hidden>아직 계정이 없으신가요? 코드를 기다리는 중이라면 <a href="./account.html">회원가입</a>을 진행해 보세요.</p>
    <button type="button" class="link-muted" id="code-back">← 이메일 다시 입력</button>
  </section>

  <!-- 3. 이동 중 -->
  <section data-step="redirect" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p class="auth-sub" style="margin-top:16px">로그인된 화면으로 이동 중…</p>
  </section>

  <p class="auth-foot">계속 진행하면 요고비 <a href="#">이용약관</a>과 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
</main>
</body>
</html>
