server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 브라우저에는 이 오리진 하나만 보인다. BE(yogob-api)는 여기서만 부른다.
  # 같은 오리진이라 CORS 설정도, 교차 사이트 쿠키(SameSite=Lax 로는 불가)도 필요 없다.
  location ~ ^/(api|oauth2|login/oauth2) {
    proxy_pass https://yogob-api.fly.dev;
    proxy_http_version 1.1;
    proxy_set_header Host yogob-api.fly.dev;          # fly 라우팅은 Host 로 앱을 고른다
    proxy_set_header X-Forwarded-Proto https;          # BE 가 Secure 쿠키·리다이렉트를 만들 때 쓴다
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    # Spring 콜드 스타트(auto_start_machines)를 기다린다. 프론트 api.js 타임아웃은 65초다.
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
  }

  # 백오피스(D-32)는 BE 가 내려주는 정적 페이지다. 같은 오리진으로 프록시해
  # admin.html 안의 /api/v1/admin/** 호출이 교차 사이트가 되지 않게 한다(쿠키 SameSite=Lax 유지).
  location ~ ^/admin\.(html|js)$ {
    proxy_pass https://yogob-api.fly.dev;
    proxy_http_version 1.1;
    proxy_set_header Host yogob-api.fly.dev;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_ssl_server_name on;
    proxy_connect_timeout 15s;
    proxy_read_timeout 60s;
  }

  # 빌드 산출물은 파일명에 해시가 들어간다(Vite). 내용이 바뀌면 이름이 바뀌므로 오래 캐시해도 안전하다.
  # 예전의 ?v= 스탬프(Dockerfile 의 sed)는 이것으로 대체돼 사라졌다.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 그 외 정적 파일(폰트 등).
  location ~* \.(woff2|png|jpe?g|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  # SPA: 라우터 경로(/results·/calendar…)는 서버에 파일이 없다 — index.html 로 넘긴다.
  # index.html 자체는 해시가 없으므로 항상 재검증한다. 그래야 새 빌드가 바로 반영된다.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  types {
    application/javascript js mjs;
    text/css css;
    text/html html;
    font/woff2 woff2;
    image/svg+xml svg;
  }
}
