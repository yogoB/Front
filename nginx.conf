server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static front only. No BE here, so /api calls fail gracefully in the UI.
  location / {
    try_files $uri $uri/ =404;
  }

  types {
    application/javascript js mjs;
    text/css css;
    text/html html;
    font/woff2 woff2;
    image/svg+xml svg;
  }
}
