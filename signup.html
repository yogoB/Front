<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>회원가입 · 요고비</title>
  <link rel="stylesheet" href="./assets/fonts.css">
  <link rel="stylesheet" href="./src/redesign.css">
  <script type="module" src="./src/signup.js"></script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="./"><span class="brand-mark">B</span>YogoB</a>
  <nav class="header-nav"><a class="btn btn-ghost" href="./login.html">로그인</a></nav>
</header>

<main class="auth" role="main">
  <div class="auth-logo" aria-hidden="true">요</div>
  <h1 id="auth-title">요고비 회원가입</h1>

  <div class="auth-card">
    <!-- 1. 이름 + 이메일 -->
    <section data-step="info">
      <form id="info-form" novalidate>
        <div class="field"><label for="name">이름</label>
          <input class="text-input" id="name" autocomplete="name" placeholder="이름" required></div>
        <div class="field"><label for="email">이메일</label>
          <input class="text-input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="이메일 주소" required></div>
        <div class="field"><label for="nickname">닉네임</label>
          <input class="text-input" id="nickname" autocomplete="nickname" placeholder="닉네임" required></div>
        <button class="btn btn-brand btn-block" type="submit">계속하기</button>
      </form>
      <div class="or-divider">또는</div>
      <button type="button" class="btn btn-social btn-block" id="google">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Google로 계속하기
      </button>
      <p class="auth-alt">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
    </section>

    <!-- 2. 비밀번호 -->
    <section data-step="password" hidden>
      <div class="field"><label for="email-ro">이메일</label>
        <input class="text-input" id="email-ro" readonly></div>
      <form id="password-form" novalidate>
        <div class="field"><label for="password">비밀번호</label>
          <div class="password-wrap">
            <input class="text-input" id="password" type="password" autocomplete="new-password" placeholder="비밀번호를 만들어 주세요" required>
            <button type="button" class="toggle" id="pw-toggle" aria-label="비밀번호 표시">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="hint" id="pw-hint">8자 이상으로 입력해 주세요.</p>
        </div>
        <button class="btn btn-brand btn-block" type="submit">계속하기</button>
      </form>
    </section>

    <!-- 3. 이메일 코드 인증 -->
    <section data-step="verify" hidden>
      <p class="auth-sub" style="text-align:left;margin:0 0 16px">아래 주소로 인증 코드를 보냈어요.<br><strong id="verify-email"></strong></p>
      <div class="code-inputs" id="code-inputs" role="group" aria-label="6자리 인증 코드">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="1번째 자리">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="2번째 자리">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="3번째 자리">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="4번째 자리">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="5번째 자리">
        <input class="code-box" inputmode="numeric" maxlength="1" aria-label="6번째 자리">
      </div>
      <p class="auth-status" id="verify-status" role="status" hidden>확인 중… <span class="spin-sm" aria-hidden="true"></span></p>
      <p class="resend">코드를 못 받으셨나요? <button type="button" id="resend" disabled>재전송 <span id="resend-count">(30)</span></button></p>
    </section>
  </div>

  <button type="button" class="link-muted" id="back" hidden>← 뒤로</button>
  <p class="auth-foot">계정을 만들면 요고비 <a href="#">이용약관</a>과 <a href="#">개인정보처리방침</a>에 동의하게 됩니다.</p>
</main>
</body>
</html>
